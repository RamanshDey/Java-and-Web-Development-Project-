<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Task Management System</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Productivity Dashboard</p>
          <h1>Smart Task Management System</h1>
        </div>
        <div class="session-panel" id="sessionPanel" hidden>
          <span id="currentUser"></span>
          <button class="ghost-button" id="logoutButton" type="button">Log out</button>
        </div>
      </header>

      <main>
        <section class="auth-layout" id="authView">
          <div class="auth-copy">
            <p class="eyebrow">Secure Workspace</p>
            <h2>Organize deadlines and priorities in one place.</h2>
            <p>Sign in or create an account to open your personal task dashboard.</p>
          </div>

          <form class="auth-panel" id="authForm">
            <div class="segmented-control" role="tablist" aria-label="Authentication mode">
              <button class="segment active" data-auth-mode="login" type="button">Login</button>
              <button class="segment" data-auth-mode="register" type="button">Register</button>
            </div>

            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" minlength="3" required />

            <label for="password">Password</label>
            <input id="password" name="password" autocomplete="current-password" minlength="6" type="password" required />

            <button class="primary-button" id="authSubmitButton" type="submit">Login</button>
          </form>
        </section>

        <section class="dashboard" id="dashboardView" hidden>
          <div class="dashboard-header">
            <div>
              <p class="eyebrow">My Tasks</p>
              <h2>Dashboard</h2>
            </div>
            <button class="primary-button compact" id="newTaskButton" type="button">New task</button>
          </div>

          <section class="summary-grid" aria-label="Task summary">
            <article class="summary-tile">
              <span>Total</span>
              <strong id="totalCount">0</strong>
            </article>
            <article class="summary-tile">
              <span>Pending</span>
              <strong id="pendingCount">0</strong>
            </article>
            <article class="summary-tile">
              <span>Completed</span>
              <strong id="completedCount">0</strong>
            </article>
            <article class="summary-tile">
              <span>High Priority</span>
              <strong id="highCount">0</strong>
            </article>
          </section>

          <div class="workspace-grid">
            <form class="task-editor" id="taskForm">
              <div class="panel-heading">
                <h3 id="taskFormTitle">Add Task</h3>
                <button class="ghost-button compact" id="cancelEditButton" type="button" hidden>Cancel</button>
              </div>

              <input id="taskId" name="taskId" type="hidden" />

              <label for="taskTitle">Title</label>
              <input id="taskTitle" name="title" maxlength="120" required />

              <label for="taskDescription">Description</label>
              <textarea id="taskDescription" name="description" maxlength="1000" rows="5"></textarea>

              <div class="form-row">
                <div>
                  <label for="taskDeadline">Deadline</label>
                  <input id="taskDeadline" name="deadline" type="date" required />
                </div>
                <div>
                  <label for="taskPriority">Priority</label>
                  <select id="taskPriority" name="priority">
                    <option>High</option>
                    <option selected>Medium</option>
                    <option>Low</option>
                  </select>
                </div>
              </div>

              <button class="primary-button" id="saveTaskButton" type="submit">Save task</button>
            </form>

            <section class="tasks-panel">
              <div class="filters">
                <div class="search-field">
                  <label for="searchInput">Search</label>
                  <input id="searchInput" name="search" placeholder="Title or keyword" />
                </div>
                <div>
                  <label for="statusFilter">Status</label>
                  <select id="statusFilter" name="status">
                    <option value="">All</option>
                    <option>Pending</option>
                    <option>Completed</option>
                  </select>
                </div>
                <div>
                  <label for="priorityFilter">Priority</label>
                  <select id="priorityFilter" name="priority">
                    <option value="">All</option>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                  </select>
                </div>
                <button class="ghost-button compact" id="clearFiltersButton" type="button">Clear</button>
              </div>

              <div class="task-list" id="taskList" aria-live="polite"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
